# Cloud Build pipeline for the OCPP Gateway. Triggered on every push
# to main that touches backend/ocpp-gateway/** (configure the path
# filter in the Cloud Build trigger UI).
#
# Build artifact: an OCI image in Artifact Registry, deployed to
# Cloud Run as voltspot-ocpp-gateway in asia-southeast1.
#
# Required substitutions (set in the trigger or in `--substitutions`):
#   _REGION                        e.g. asia-southeast1
#   _SERVICE                       e.g. voltspot-ocpp-gateway
#   _AR_REPO                       e.g. voltspot
#   _FIREBASE_PROJECT_ID           Firebase project the gateway talks to
#
# Required service account (run by Cloud Build): roles/run.admin,
# roles/iam.serviceAccountUser, roles/artifactregistry.writer.

steps:
  # ─── Test ───────────────────────────────────────────────────────────
  # Catches regressions before we burn deploy minutes. Keep cheap.
  - id: test
    name: golang:1.25-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        apk add --no-cache git
        go mod download
        go vet ./...
        go test ./...

  # ─── Build + push image ────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"
      - --tag
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest"
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}"

  # ─── Deploy ─────────────────────────────────────────────────────────
  # min-instances=1 keeps the container warm so charger WebSockets
  # don't drop on scale-to-zero; cpu-always-allocated is required for
  # background goroutines (read pump, idle sweeper) to run when there
  # are no inbound HTTP requests.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - --image
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"
      - --region
      - "${_REGION}"
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --min-instances=1
      - --max-instances=10
      - --cpu=1
      - --memory=512Mi
      - --concurrency=1000
      - --timeout=60
      - --no-cpu-throttling
      - --session-affinity
      - --set-env-vars
      - "FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}"

# Image tags Cloud Build records on the build summary.
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
